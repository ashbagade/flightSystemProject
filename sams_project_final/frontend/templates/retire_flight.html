{% extends "base.html" %}

{% block title %}Retire Flight{% endblock %}

{% block content %}
<div class="container">
    <h2>Retire Flight</h2>
    <form method="POST" action="{{ url_for('retire_flight') }}">
        <div class="mb-3">
            <label for="flight_id" class="form-label">Flight ID</label>
            <input type="text" class="form-control" id="flight_id" name="flight_id" required>
        </div>
        <button type="submit" class="btn btn-primary">Retire Flight</button>
    </form>
</div>
{% endblock %}
