{% extends "base.html" %}

{% block title %}Grant or Revoke Pilot License{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Procedure: Grant or Revoke Pilot License</h2>
    <div class="card mt-4">
        <div class="card-body" style="background:#f5f5f5;">
            <h4>grant_or_revoke_pilot_license()</h4>
            <form action="{{ url_for('pilot_license') }}" method="POST">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">Person ID</label>
                        <input type="text" class="form-control" name="personID" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">License</label>
                        <input type="text" class="form-control" name="license" required>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('pilots') }}" class="btn btn-secondary w-25">Cancel</a>
                    <button type="submit" class="btn btn-dark w-25">Add / Revoke</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
