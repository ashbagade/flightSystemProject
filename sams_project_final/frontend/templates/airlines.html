{% extends 'base.html' %}

{% block title %}Airlines{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Airlines</h2>
    
    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Airline ID</th>
                    <th>Revenue</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for airline in airlines %}
                <tr>
                    <td>{{ airline.airlineID }}</td>
                    <td>${{ airline.revenue or '0' }}</td>
                    <td>
                        <a href="{{ url_for('edit_airline', aid=airline.airlineID) }}" class="btn btn-sm btn-primary">Edit</a>
                        <form action="{{ url_for('delete_airline', aid=airline.airlineID) }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addAirlineModal">
            Add New Airline
        </button>
    </div>

    <!-- Add Airline Modal -->
    <div class="modal fade" id="addAirlineModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Airline</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form action="{{ url_for('add_airline') }}" method="POST">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="airlineID" class="form-label">Airline ID</label>
                            <input type="text" class="form-control" id="airlineID" name="airlineID" required>
                        </div>
                        <div class="mb-3">
                            <label for="revenue" class="form-label">Revenue</label>
                            <input type="number" class="form-control" id="revenue" name="revenue" step="0.01">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Add Airline</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
