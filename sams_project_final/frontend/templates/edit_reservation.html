{% extends 'base.html' %}

{% block title %}Edit Reservation{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Edit Reservation</h2>
    
    <form action="{{ url_for('edit_reservation', rid=reservation.reservationID) }}" method="POST">
        <div class="mb-3">
            <label for="reservationID" class="form-label">Reservation ID</label>
            <input type="text" class="form-control" id="reservationID" value="{{ reservation.reservationID }}" disabled>
        </div>
        <div class="mb-3">
            <label for="personID" class="form-label">Person ID</label>
            <input type="text" class="form-control" id="personID" name="personID" value="{{ reservation.personID }}" required>
        </div>
        <div class="mb-3">
            <label for="flightID" class="form-label">Flight ID</label>
            <input type="text" class="form-control" id="flightID" name="flightID" value="{{ reservation.flightID }}" required>
        </div>
        <div class="mb-3">
            <label for="seat_number" class="form-label">Seat Number</label>
            <input type="text" class="form-control" id="seat_number" name="seat_number" value="{{ reservation.seat_number }}" required>
        </div>
        <div class="mb-3">
            <label for="reservation_date" class="form-label">Reservation Date</label>
            <input type="date" class="form-control" id="reservation_date" name="reservation_date" value="{{ reservation.reservation_date }}" required>
        </div>
        <div class="mb-3">
            <label for="cost" class="form-label">Cost</label>
            <input type="number" step="0.01" class="form-control" id="cost" name="cost" value="{{ reservation.cost }}" required>
        </div>
        <div class="mt-4">
            <a href="{{ url_for('reservations') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
