<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Airports - SAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Airports</h1>
        
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Airport ID</th>
                        <th>Airport Name</th>
                        <th>City</th>
                        <th>State</th>
                        <th>Country</th>
                        <th>Location ID</th>
                    </tr>
                </thead>
                <tbody>
                    {% for airport in airports %}
                    <tr>
                        <td>{{ airport.airportID }}</td>
                        <td>{{ airport.airport_name or 'N/A' }}</td>
                        <td>{{ airport.city }}</td>
                        <td>{{ airport.state }}</td>
                        <td>{{ airport.country }}</td>
                        <td>{{ airport.locationID or 'N/A' }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-primary">Back to Home</a>
        </div>
    </div>
</body>
</html>
