{% extends 'base.html' %}

{% block title %}Edit Airline{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Edit Airline</h2>
    
    <form action="{{ url_for('edit_airline', aid=airline.airlineID) }}" method="POST">
        <div class="mb-3">
            <label for="airlineID" class="form-label">Airline ID</label>
            <input type="text" class="form-control" id="airlineID" value="{{ airline.airlineID }}" disabled>
        </div>
        <div class="mb-3">
            <label for="revenue" class="form-label">Revenue</label>
            <input type="number" step="0.01" class="form-control" id="revenue" name="revenue" value="{{ airline.revenue or '' }}">
        </div>
        <div class="mt-4">
            <a href="{{ url_for('airlines') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
