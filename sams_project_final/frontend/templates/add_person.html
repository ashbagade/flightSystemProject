{% extends "base.html" %}

{% block title %}Add Person{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Procedure: Add Person</h2>
    <div class="card mt-4">
        <div class="card-body" style="background:#f5f5f5;">
            <h4>add_person()</h4>
            <form action="{{ url_for('add_person') }}" method="POST">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">Person ID</label>
                        <input type="text" class="form-control" name="personID" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">First Name</label>
                        <input type="text" class="form-control" name="first_name" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">Last Name</label>
                        <input type="text" class="form-control" name="last_name" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">Location ID</label>
                        <input type="text" class="form-control" name="locationID" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">Tax ID</label>
                        <input type="text" class="form-control" name="taxID" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">Experience</label>
                        <input type="number" class="form-control" name="experience" min="0">
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">Miles</label>
                        <input type="number" class="form-control" name="miles">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold bg-secondary text-white p-2 w-100">Funds</label>
                        <input type="number" class="form-control" name="funds" step="0.01">
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('passengers') }}" class="btn btn-secondary w-25">Cancel</a>
                    <button type="submit" class="btn btn-dark w-25">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
