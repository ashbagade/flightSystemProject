<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pilots - SAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Pilots</h1>
        
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Person ID</th>
                        <th>Tax ID</th>
                        <th>Experience</th>
                        <th>Commanding Flight</th>
                    </tr>
                </thead>
                <tbody>
                    {% for pilot in pilots %}
                    <tr>
                        <td>{{ pilot.personID }}</td>
                        <td>{{ pilot.taxID }}</td>
                        <td>{{ pilot.experience }} years</td>
                        <td>{{ pilot.commanding_flight or 'None' }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-primary">Back to Home</a>
        </div>
    </div>
</body>
</html>
