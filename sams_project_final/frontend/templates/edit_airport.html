{% extends 'base.html' %}

{% block title %}Edit Airport{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Edit Airport</h2>
    
    <form action="{{ url_for('edit_airport', airportID=airport.airportID) }}" method="POST">
        <div class="mb-3">
            <label for="airportID" class="form-label">Airport ID</label>
            <input type="text" class="form-control" id="airportID" value="{{ airport.airportID }}" disabled maxlength="3">
            <small class="form-text text-muted">Airport ID must be exactly 3 characters</small>
        </div>
        <div class="mb-3">
            <label for="airport_name" class="form-label">Airport Name</label>
            <input type="text" class="form-control" id="airport_name" name="airport_name" value="{{ airport.airport_name }}" required>
        </div>
        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" name="city" value="{{ airport.city }}" required>
        </div>
        <div class="mb-3">
            <label for="state" class="form-label">State</label>
            <input type="text" class="form-control" id="state" name="state" value="{{ airport.state }}" required maxlength="2">
            <small class="form-text text-muted">State code must be 2 characters</small>
        </div>
        <div class="mb-3">
            <label for="country" class="form-label">Country</label>
            <input type="text" class="form-control" id="country" name="country" value="{{ airport.country }}" required>
        </div>
        <div class="mb-3">
            <label for="locationID" class="form-label">Location ID</label>
            <input type="text" class="form-control" id="locationID" name="locationID" value="{{ airport.locationID }}" required>
            <small class="form-text text-muted">Must be a valid location ID from the database</small>
        </div>
        <div class="mt-4">
            <a href="{{ url_for('airports') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
